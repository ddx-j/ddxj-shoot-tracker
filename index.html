<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoot & Edit Log</title>
</head>
<body>
<div id="root"></div>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #f7f4ee;
    --tape: #d6501f;
    --tape-dim: #f0d9cd;
    --line: #d9d3c7;
    --mono: 'Courier New', monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #root {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    padding: 28px 20px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  .slate {
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 22px;
    position: relative;
    background:
      repeating-linear-gradient(135deg, var(--ink) 0 14px, transparent 14px 28px) top left / 100% 10px no-repeat,
      var(--paper);
  }
  .slate-top {
    height: 10px;
    margin: -18px -20px 14px;
    background: repeating-linear-gradient(135deg, var(--ink) 0 14px, var(--paper) 14px 28px);
    border-bottom: 2px solid var(--ink);
  }
  .slate h1 {
    font-family: var(--mono);
    font-size: 20px;
    letter-spacing: 1px;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .slate p {
    font-family: var(--mono);
    font-size: 12px;
    color: #6b655a;
    margin: 0;
  }
  .project-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .project-field { flex: 1; }
  .project-field:first-child { flex: 1.6; }
  .project-field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: #8a8375;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .project-field input {
    width: 100%;
    font-family: var(--serif);
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
  }
  .project-field input[type="date"] {
    font-family: var(--mono);
    font-size: 13px;
  }

  .rate-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .rate-btn {
    flex: 1;
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 8px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    text-align: center;
  }
  .rate-btn.active {
    background: var(--tape);
    border-color: var(--tape);
    color: #fff;
  }
  .rate-btn small { display: block; font-size: 10px; opacity: 0.75; margin-top: 2px; }
  .rate-btn.floor { position: relative; }
  .floor-input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .floor-input-row span { font-size: 14px; }
  .floor-input {
    width: 36px;
    font-family: var(--mono);
    font-size: 14px;
    text-align: center;
    border: none;
    border-bottom: 1px dashed currentColor;
    background: transparent;
    color: inherit;
    padding: 0 0 1px;
  }
  .floor-input:focus { outline: none; }
  /* remove number input spinners */
  .floor-input::-webkit-outer-spin-button,
  .floor-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .floor-input[type=number] { -moz-appearance: textfield; }

  .session {
    border: 1px solid var(--line);
    border-left: 4px solid var(--tape);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #fff;
  }
  .session-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .session-head input.label-input {
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: none;
    background: transparent;
    font-weight: bold;
    width: 65%;
    padding: 2px 0;
    border-bottom: 1px dashed transparent;
  }
  .session-head input.label-input:focus {
    outline: none;
    border-bottom: 1px dashed var(--tape);
  }
  .remove-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: #a3392f;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .time-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .time-field { flex: 1; min-width: 110px; }
  .time-field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: #8a8375;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .time-field input[type="time"] {
    width: 100%;
    font-family: var(--mono);
    font-size: 14px;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
  }
  .session-result {
    font-family: var(--mono);
    font-size: 12px;
    color: #6b655a;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .session-result strong { color: var(--ink); }

  .punch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .punch-btn {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 14px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .punch-btn.running {
    background: var(--tape);
    border-color: var(--tape);
    color: #fff;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .punch-live {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--tape);
    font-weight: bold;
  }

  .add-btn {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    border: 2px dashed var(--line);
    border-radius: 4px;
    background: none;
    color: #6b655a;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .add-btn:hover { border-color: var(--tape); color: var(--tape); }

  .total-card {
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 20px;
    background: var(--ink);
    color: var(--paper);
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 13px;
    padding: 5px 0;
    color: #cfc9bc;
  }
  .total-row.final {
    border-top: 1px solid #4a463e;
    margin-top: 8px;
    padding-top: 12px;
    font-size: 22px;
    color: #fff;
    font-weight: bold;
  }
  .total-row.final span:last-child { color: var(--tape); }
  .rounding-note {
    font-family: var(--mono);
    font-size: 10px;
    color: #8a8375;
    margin-top: 18px;
    line-height: 1.6;
  }

  .export-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .export-btn {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 12px;
    border: 2px solid var(--tape);
    border-radius: 4px;
    background: var(--tape);
    color: #fff;
    cursor: pointer;
    text-transform: uppercase;
  }
  .export-btn.secondary {
    background: var(--ink);
    border-color: var(--ink);
  }
  .export-btn:hover { background: #b8420f; border-color: #b8420f; }
  .export-btn.secondary:hover { background: #34302a; border-color: #34302a; }
  .export-btn.copied { background: #4a463e; border-color: #4a463e; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

function round(hours) {
  // 0-15 min down, 16-45 nearest half, 46-60 up
  const wholeHours = Math.floor(hours);
  const minutes = (hours - wholeHours) * 60;
  let add;
  if (minutes <= 15) add = 0;
  else if (minutes <= 45) add = 0.5;
  else add = 1;
  return wholeHours + add;
}

function diffHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}

function fmtHours(h) {
  const whole = Math.floor(h);
  const frac = h - whole;
  if (frac === 0) return `${whole} hr`;
  if (frac === 0.5) return `${whole}.5 hr`;
  return `${h.toFixed(2)} hr`;
}

function nowTimeStr() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function fmtElapsed(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function App() {
  const [projectTitle, setProjectTitle] = useState('');
  const [projectDate, setProjectDate] = useState(todayStr());
  const [rate, setRate] = useState(50);
  const [floorRate, setFloorRate] = useState(40);
  const [sessions, setSessions] = useState([
    { id: 1, label: 'Shoot', start: '', end: '' },
    { id: 2, label: 'Edit — session 1', start: '', end: '' },
  ]);
  const [nextId, setNextId] = useState(3);
  const [copied, setCopied] = useState(false);
  const [now, setNow] = useState(Date.now());

  const anyRunning = sessions.some(s => s.runningSince);

  useEffect(() => {
    if (!anyRunning) return;
    const interval = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(interval);
  }, [anyRunning]);

  const handlePunch = (id) => {
    setSessions(prev => prev.map(s => {
      if (s.id !== id) return s;
      if (s.runningSince) {
        // punching out
        return { ...s, end: nowTimeStr(), runningSince: null };
      }
      // punching in
      return { ...s, start: nowTimeStr(), end: '', runningSince: Date.now() };
    }));
  };

  const updateSession = (id, field, value) => {
    setSessions(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
  };

  const addSession = () => {
    setSessions(prev => [...prev, { id: nextId, label: `Edit — session ${prev.length}`, start: '', end: '', runningSince: null }]);
    setNextId(n => n + 1);
  };

  const removeSession = (id) => {
    setSessions(prev => prev.filter(s => s.id !== id));
  };

  const computed = useMemo(() => {
    return sessions.map(s => {
      const raw = diffHours(s.start, s.end);
      const rounded = raw > 0 ? round(raw) : 0;
      return { ...s, raw, rounded };
    });
  }, [sessions]);

  const totalRounded = computed.reduce((sum, s) => sum + s.rounded, 0);
  const totalCost = totalRounded * rate;

  const buildSummary = () => {
    const lines = [];
    lines.push(projectTitle ? projectTitle : 'Untitled Project');
    lines.push(projectDate || todayStr());
    lines.push('');
    computed.forEach(s => {
      if (s.raw > 0) {
        lines.push(`${s.label}: ${s.start}–${s.end} → ${fmtHours(s.rounded)}`);
      } else {
        lines.push(`${s.label}: (no time logged)`);
      }
    });
    lines.push('');
    lines.push(`Total: ${fmtHours(totalRounded)} @ $${rate}/hr = $${totalCost.toFixed(0)}`);
    return lines.join('\n');
  };

  const handleExport = async () => {
    const text = buildSummary();
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // fallback: select-and-copy not available, just show the text
      window.prompt('Copy this summary:', text);
    }
  };

  const csvEscape = (val) => {
    const s = String(val);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return `"${s.replace(/"/g, '""')}"`;
    }
    return s;
  };

  const buildCSV = () => {
    const rows = [];
    rows.push(['Project', projectTitle || 'Untitled Project']);
    rows.push(['Date', projectDate || todayStr()]);
    rows.push([]);
    rows.push(['Session', 'Start', 'End', 'Raw Hours', 'Rounded Hours']);
    computed.forEach(s => {
      rows.push([
        s.label,
        s.start || '',
        s.end || '',
        s.raw > 0 ? s.raw.toFixed(2) : '',
        s.raw > 0 ? s.rounded : '',
      ]);
    });
    rows.push([]);
    rows.push(['Total Hours', totalRounded]);
    rows.push(['Rate', `$${rate}/hr`]);
    rows.push(['Total Cost', `$${totalCost.toFixed(0)}`]);
    return rows.map(r => r.map(csvEscape).join(',')).join('\n');
  };

  const handleExportCSV = () => {
    const csv = buildCSV();
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeTitle = (projectTitle || 'shoot-log').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    a.href = url;
    a.download = `${safeTitle}-${projectDate || todayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="slate">
        <div className="slate-top"></div>
        <h1>Shoot & Edit Log</h1>
        <p>Track sessions below — hours round to the nearest half hour, then multiply by your rate.</p>
      </div>

      <div className="project-row">
        <div className="project-field">
          <label>Project</label>
          <input
            type="text"
            placeholder="e.g. Sarah — Instagram promo"
            value={projectTitle}
            onChange={e => setProjectTitle(e.target.value)}
          />
        </div>
        <div className="project-field">
          <label>Date</label>
          <input
            type="date"
            value={projectDate}
            onChange={e => setProjectDate(e.target.value)}
          />
        </div>
      </div>

      <div className="rate-row">
        <button
          className={`rate-btn ${rate === 50 ? 'active' : ''}`}
          onClick={() => setRate(50)}
        >
          $50/hr<small>opening rate</small>
        </button>
        <button
          className={`rate-btn floor ${rate === floorRate ? 'active' : ''}`}
          onClick={() => setRate(floorRate)}
        >
          <div className="floor-input-row">
            <span>$</span>
            <input
              className="floor-input"
              type="number"
              min="1"
              value={floorRate}
              onClick={e => e.stopPropagation()}
              onChange={e => {
                const v = Number(e.target.value) || 0;
                setFloorRate(v);
                setRate(prev => (prev === floorRate ? v : prev));
              }}
            />
            <span>/hr</span>
          </div>
          <small>floor rate — click to edit</small>
        </button>
      </div>

      {computed.map(s => (
        <div className="session" key={s.id}>
          <div className="session-head">
            <input
              className="label-input"
              value={s.label}
              onChange={e => updateSession(s.id, 'label', e.target.value)}
            />
            {sessions.length > 1 && (
              <button className="remove-btn" onClick={() => removeSession(s.id)}>remove</button>
            )}
          </div>
          <div className="time-row">
            <div className="time-field">
              <label>Start</label>
              <input type="time" value={s.start} onChange={e => updateSession(s.id, 'start', e.target.value)} />
            </div>
            <div className="time-field">
              <label>End</label>
              <input type="time" value={s.end} onChange={e => updateSession(s.id, 'end', e.target.value)} />
            </div>
          </div>
          <div className="punch-row">
            <button
              className={`punch-btn ${s.runningSince ? 'running' : ''}`}
              onClick={() => handlePunch(s.id)}
            >
              {s.runningSince ? 'punch out' : 'punch in'}
            </button>
            {s.runningSince && (
              <span className="punch-live">{fmtElapsed(now - s.runningSince)} elapsed</span>
            )}
          </div>
          {s.raw > 0 && (
            <div className="session-result">
              Raw: {s.raw.toFixed(2)} hr → Rounded: <strong>{fmtHours(s.rounded)}</strong>
            </div>
          )}
        </div>
      ))}

      <button className="add-btn" onClick={addSession}>+ add another session</button>

      <div className="total-card">
        <div className="total-row">
          <span>Total rounded hours</span>
          <span>{fmtHours(totalRounded)}</span>
        </div>
        <div className="total-row">
          <span>Rate</span>
          <span>${rate}/hr</span>
        </div>
        <div className="total-row final">
          <span>Total</span>
          <span>${totalCost.toFixed(0)}</span>
        </div>
      </div>

      <div className="export-row">
        <button className={`export-btn ${copied ? 'copied' : ''}`} onClick={handleExport}>
          {copied ? '✓ copied' : 'copy summary'}
        </button>
        <button className="export-btn secondary" onClick={handleExportCSV}>
          download csv
        </button>
      </div>

      <div className="rounding-note">
        Rounding rule: 0–15 min down · 16–45 min → nearest half hour · 46–60 min up.<br/>
        "Punch in" grabs the current time as Start; "punch out" grabs it as End — or just type times manually.<br/>
        Entries are editable any time — click into any field to change it.<br/>
        "Download CSV" opens directly in Excel, Numbers, or Google Sheets.<br/>
        This tracker resets if you close or reload the tab — export before you leave.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
